[project]
name = "receipt-processor-backend"
version = "0.1.0"
description = "Verified receipt extraction API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "groq>=0.13",
    "tenacity>=9.0",
    "slowapi>=0.1.9",
    "pillow>=11.0",
    "pymupdf>=1.24",
    "filetype>=1.2",
    "pycountry>=24.6",
    "gspread>=6.2.1",
    "psycopg>=3.3.8",
    "psycopg-binary>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI declares dependencies and file params in argument defaults; UP042 is a style preference.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/services"]
python-downloads = "manual"
