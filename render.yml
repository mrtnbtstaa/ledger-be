services:
  - type: web
    name: receipts-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: receipts
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"

databases:
  - name: receipts
    plan: free
    region: oregon